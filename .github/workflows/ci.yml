name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check research_service scripts

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r research_service/requirements.txt

      - name: Run unittest suite
        run: python -m unittest discover -s research_service/tests -p "test_*.py" -v

  static-frontend-check:
    name: Static frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check static assets
        run: |
          node --check research_service/static/app.js
          node --check research_service/static/readiness-rules.js

      - name: Run frontend unit tests
        run: node --test research_service/tests_js/*.test.js

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build research image
        run: docker build -f Dockerfile.research -t stance-shift-lab-research .
