name: CI

on:
  # Every branch is checked on push, so work can be verified before a PR exists.
  # Dependabot branches are covered by their own pull requests.
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check research_service scripts

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install .

      - name: Smoke-test the installed entry point
        working-directory: ${{ runner.temp }}
        run: stance-shift version

      - name: pip install serves the web app (docs/run-options.md 跑法三)
        working-directory: ${{ runner.temp }}
        run: |
          RESEARCH_DATA_DIR=pip-serve-data stance-shift serve --port 8011 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8011/health && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8011/ || { cat serve.log; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8011/assets/js/settings-panel.js || { cat serve.log; exit 1; }
          kill %1

      - name: README CLI and Python usage run end to end (demo mode)
        working-directory: ${{ runner.temp }}
        env:
          RESEARCH_DEMO_MODE: "true"
          RESEARCH_DATA_DIR: readme-cli-data
        run: |
          stance-shift < /dev/null | tee cli.log
          grep -q "D 立場交換辯論" cli.log
          stance-shift run NVDA 2024-12-31 --json > run.json
          python -c "import json; r = json.load(open('run.json', encoding='utf-8')); assert r['status'] == 'complete' and set(r['decisions']) == set('ABCD'), r"
          stance-shift jobs | grep -c complete | grep -qx 2
          python - <<'PY'
          from research_service import StanceShiftResearch
          research = StanceShiftResearch(model="gemini/gemini-2.5-flash")
          result = research.run("NVDA", "2024-12-31", use_finbert=True)
          assert set(result["decisions"]) == set("ABCD"), result
          PY

      - name: Run unittest suite
        run: python -m unittest discover -s research_service/tests -p "test_*.py" -v

  windows-python-tests:
    name: Windows Python unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install .

      - name: README CLI runs on Windows (demo mode)
        working-directory: ${{ runner.temp }}
        env:
          RESEARCH_DEMO_MODE: "true"
          RESEARCH_DATA_DIR: readme-cli-data
        run: |
          stance-shift run NVDA 2024-12-31 --json > run.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import json; r = json.load(open('run.json', encoding='utf-8')); assert r['status'] == 'complete', r"
          stance-shift run NVDA 2024-12-31
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run unittest suite
        run: python -m unittest discover -s research_service/tests -p "test_*.py" -v

  static-frontend-check:
    name: Static frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check static assets
        run: |
          for module in research_service/static/js/*.js; do node --check "$module" || exit 1; done

  browser-e2e:
    name: Browser end-to-end (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and Playwright
        run: |
          pip install . "playwright>=1.47"
          python -m playwright install --with-deps chromium

      - name: Run the demo experiment through the UI
        run: python -m unittest research_service.tests.test_e2e_demo -v

  # Docker is the only supported way to run the service. This job follows the
  # same steps a new user takes (fresh checkout, ./research.sh start) on both
  # x86-64 and ARM64, the two architectures Docker Desktop runs on Windows,
  # macOS (Intel and Apple Silicon) and Linux.
  docker-run:
    name: Docker start (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable keyless demo mode
        run: |
          cp research.env.example .env.research
          sed -i 's/^RESEARCH_DEMO_MODE=.*/RESEARCH_DEMO_MODE=true/' .env.research

      - name: Start through the Mac/Linux launcher
        run: ./research.sh start

      - name: Service answers inside Docker
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/models | grep -q '"ready":true'
          curl -fsS -o /dev/null http://127.0.0.1:8000/

      - name: Unit tests inside the image
        run: ./research.sh test

      - name: README Docker CLI (./research.sh cli) runs a case
        run: |
          ./research.sh cli run NVDA 2024-12-31 --json > run.json
          python3 -c "import json; r = json.load(open('run.json', encoding='utf-8')); assert r['status'] == 'complete', r"

      - name: Ollama container option reaches the research service
        run: |
          compose="docker compose -f compose.research.yaml -f compose.ollama.yaml"
          $compose config -q
          docker compose -f compose.research.yaml -f compose.ollama.yaml -f compose.ollama-gpu.yaml config -q
          $compose up -d
          for i in $(seq 1 30); do
            $compose exec -T research python -c "import urllib.request; urllib.request.urlopen('http://ollama:11434/api/tags', timeout=5)" && exit 0
            sleep 2
          done
          $compose logs ollama
          exit 1

      - name: research.sh picks up the Ollama container setting
        run: RESEARCH_OLLAMA_CONTAINER=true ./research.sh status | grep -q ollama

      - name: Service logs on failure
        if: failure()
        run: docker compose -f compose.research.yaml logs research

  # Builds the Codespaces dev container and runs its start hook, the same
  # path as clicking Code → Codespaces → Create on GitHub.
  codespace:
    name: Codespace start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable keyless demo mode
        run: |
          cp research.env.example .env.research
          sed -i 's/^RESEARCH_DEMO_MODE=.*/RESEARCH_DEMO_MODE=true/' .env.research

      - name: Start the dev container and check the service
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            curl -fsS http://127.0.0.1:8000/health
            curl -fsS http://127.0.0.1:8000/api/models | grep -q '"ready":true'
