name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r research_service/requirements.txt

      - name: Run unittest suite
        run: python -m unittest discover -s research_service/tests -p "test_*.py" -v

  static-frontend-check:
    name: Static frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check static/app.js
        run: node --check research_service/static/app.js

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build research image
        run: docker build -f Dockerfile.research -t stance-shift-lab-research .
