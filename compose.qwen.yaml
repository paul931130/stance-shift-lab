# Experiment E2: qwen3:32b, quarterly design, protocol v3-0929.1 (finished; 180/180 complete).
# Sealed: pinned image, its own copy of the database (taken 2026-09-29, sha256 verified),
# so the results in the report can be re-opened without touching any other experiment.
# Start it only to inspect results; new GPU work for this experiment is not planned.
#   docker compose -p stance-shift-lab -f compose.qwen.yaml up -d
services:
  research-qwen:
    image: stance-shift-lab-research-qwen:v3-0929.1
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - path: .env.research
        required: false
    environment:
      RESEARCH_CONTAINER_LOCAL: "true"
      RESEARCH_ENABLE_LIVE: "false"
      RESEARCH_DATA_DIR: /data
      RESEARCH_MODEL: ollama/qwen3:32b
      RESEARCH_MODEL_TIMEOUT_SECONDS: "600"
    volumes:
      - research-data-qwen:/data
      - ./research-inputs:/app/research-inputs
volumes:
  research-data-qwen:
    external: true
    name: stance-shift-lab_research-data-qwen
