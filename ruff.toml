target-version = "py312"
extend-exclude = [".venv", "research-data", "work", "_stance_shift_backups"]

[lint]
# Correctness-focused set: syntax errors, undefined names, unused imports/vars.
# Deliberately narrower than ruff's growing plugin catalogue so CI stays a
# signal for real bugs instead of a style-preference gate.
select = ["E4", "E7", "E9", "F"]
