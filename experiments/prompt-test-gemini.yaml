# Prompt check for v3-1002.3 on Gemini Flash before the formal qwen3:32b run.
# Not a study: no preregistration, own copy of the E2' database, results never mixed with E2'.
#   docker volume create stance-shift-lab_prompt-test
#   (copy research.sqlite3 from stance-shift-lab_research-data-qwen-v2 into it)
#   docker compose -p stance-shift-lab -f experiments/prompt-test-gemini.yaml up -d
services:
  prompt-test:
    image: stance-shift-lab-research-qwen:v3-1002.3
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:8004:8000"
    env_file:
      - path: ../.env.research
        required: false
    environment:
      RESEARCH_CONTAINER_LOCAL: "true"
      RESEARCH_ENABLE_LIVE: "false"
      RESEARCH_DATA_DIR: /data
      RESEARCH_MODEL: gemini/gemini-2.5-flash
      RESEARCH_MODEL_TIMEOUT_SECONDS: "300"
      # Never touch the GPU from this service.
      RESEARCH_GPUTW_AUTOSTOP_MINUTES: "0"
    volumes:
      - prompt-test:/data
      - ../research-inputs:/app/research-inputs
volumes:
  prompt-test:
    external: true
    name: stance-shift-lab_prompt-test
