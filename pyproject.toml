[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stance-shift-research"
version = "3.0.0"
description = "Auditable multi-agent stance-shift research service"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "langgraph==1.2.12",
  "litellm==1.99.0",
  "yfinance==1.7.0",
  "pandas==3.0.1",
  "numpy==2.3.5",
  "scipy==1.18.1",
  "rich==15.0.0",
  "questionary==2.1.1",
]

[project.optional-dependencies]
finbert = [
  "torch==2.8.0",
  "transformers==5.10.0",
]
dev = [
  "ruff>=0.12",
  "playwright>=1.47",
]

[project.scripts]
stance-shift = "research_service.cli:main"

[tool.setuptools.packages.find]
include = ["research_service*"]

[tool.setuptools.package-data]
research_service = ["static/*", "static/js/*"]

